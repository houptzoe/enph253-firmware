; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; USB serial upload (default). Flash over the cable, e.g.:
;   pio run -t upload
[platformio]
default_envs = esp32-s3-devkitm-1

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBATTERY_VOLTAGE=16.0f
    -DMOTOR_MAX_VOLTAGE=15.0f
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

; SoftAP OTA — join Wi-Fi SSID "dragonflyyy" (open), then:
;   pio run -e esp32-s3-ota -t upload
; Requires firmware already running with ArduinoOTA (USB flash once first).
[env:esp32-s3-ota]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBATTERY_VOLTAGE=16.0f
    -DMOTOR_MAX_VOLTAGE=15.0f
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=
